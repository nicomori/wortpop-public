<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WortPop account action</title>
  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f3ff; color:#211a3a; }
    main { width:min(92vw,520px); box-sizing:border-box; padding:32px; border-radius:24px; background:#fff; box-shadow:0 20px 60px rgba(48,36,92,.12); text-align:center; }
    h1 { margin:0 0 8px; font-size:2rem; }
    p { line-height:1.55; }
    .status { margin-top:22px; padding:16px; border-radius:14px; background:#f3f0ff; }
    .ok { background:#e9f9ef; color:#0d5b2a; }
    .error { background:#fff0f0; color:#8f1d1d; }
    form { display:grid; gap:12px; margin-top:20px; text-align:left; }
    label { font-weight:600; }
    input { box-sizing:border-box; width:100%; padding:12px 14px; border:1px solid #c9c1e8; border-radius:12px; font:inherit; }
    button { padding:12px 16px; border:0; border-radius:12px; font:inherit; font-weight:700; cursor:pointer; background:#5b42d6; color:#fff; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <h1>WortPop</h1>
    <p id="subtitle">Account action</p>
    <div id="status" class="status">Checking your link…</div>
    <form id="reset-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" minlength="6" autocomplete="new-password" required>
      <button type="submit">Set new password</button>
    </form>
  </main>
  <script>
    (() => {
      const API_KEY = "AIzaSyD_DOjra3Qiw2MbVCd-gLDy39DS3idQmHk";
      const params = new URLSearchParams(location.search);
      const mode = params.get("mode");
      const oobCode = params.get("oobCode");
      const statusEl = document.getElementById("status");
      const subtitle = document.getElementById("subtitle");
      const resetForm = document.getElementById("reset-form");
      const passwordInput = document.getElementById("new-password");

      function show(message, kind = "") {
        statusEl.textContent = message;
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      function messageFor(error) {
        const code = String(error || "");
        if (code.includes("EXPIRED_OOB_CODE")) return "This link has expired. Return to WortPop and request a new email.";
        if (code.includes("INVALID_OOB_CODE")) return "This link is invalid or has already been used. Return to WortPop and request a new email.";
        if (code.includes("WEAK_PASSWORD")) return "Choose a stronger password and try again.";
        return "We could not complete this account action. Return to WortPop and request a new email.";
      }

      async function post(path, body) {
        const response = await fetch("https://identitytoolkit.googleapis.com/v1/" + path + "?key=" + encodeURIComponent(API_KEY), {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body)
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload?.error?.message || "UNKNOWN");
        return payload;
      }

      if (!oobCode || !["verifyEmail", "resetPassword", "recoverEmail"].includes(mode)) {
        show("This WortPop link is incomplete. Request a new email from the app.", "error");
        return;
      }

      if (mode === "verifyEmail") {
        subtitle.textContent = "Email verification";
        post("accounts:update", {oobCode})
          .then(() => show("Email verified successfully. Return to WortPop and tap “I've verified my email”.", "ok"))
          .catch(error => show(messageFor(error.message), "error"));
        return;
      }

      if (mode === "recoverEmail") {
        subtitle.textContent = "Restore email address";
        post("accounts:update", {oobCode})
          .then(() => show("Your email address was restored successfully. You can return to WortPop.", "ok"))
          .catch(error => show(messageFor(error.message), "error"));
        return;
      }

      subtitle.textContent = "Reset password";
      post("accounts:resetPassword", {oobCode})
        .then(payload => {
          const target = payload.email ? " for " + payload.email : "";
          show("Enter a new password" + target + ".");
          resetForm.hidden = false;
          passwordInput.focus();
        })
        .catch(error => show(messageFor(error.message), "error"));

      resetForm.addEventListener("submit", event => {
        event.preventDefault();
        const newPassword = passwordInput.value;
        resetForm.hidden = true;
        show("Updating your password…");
        post("accounts:resetPassword", {oobCode, newPassword})
          .then(() => show("Password updated successfully. You can return to WortPop and sign in.", "ok"))
          .catch(error => {
            show(messageFor(error.message), "error");
            resetForm.hidden = false;
          });
      });
    })();
  </script>
</body>
</html>
